# supabase/config.toml
# Minimal local development config for MusiGod.
# Used by: supabase start, supabase db reset, supabase db diff
#
# Prerequisites:
#   - Docker Desktop running
#   - supabase CLI installed (v2.65.5 or newer)
#
# Quick start:
#   supabase start        # starts local stack (DB + PostgREST + Studio)
#   npm run db:test:migrate   # apply migrations, run constraint/RLS tests
#   supabase stop         # stop local stack

project_id = "musigod-deploy"

[api]
enabled      = true
port         = 54321
# Schemas exposed via PostgREST — must include registrations for intake tables.
schemas      = [
  "public",
  "registrations",
  "graph",
  "works",
  "rights",
  "royalties",
  "disputes",
  "legal",
]
extra_search_path = ["public", "extensions"]
max_rows     = 1000

[db]
port         = 54322
shadow_port  = 54320
major_version = 15

[studio]
enabled = true
port    = 54323

[inbucket]
enabled   = true
port      = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled         = true
file_size_limit = "50MiB"

[auth]
enabled                       = true
site_url                      = "http://localhost:3000"
additional_redirect_urls      = ["https://localhost:3000"]
jwt_expiry                    = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval  = 10
enable_signup                 = true

[auth.email]
enable_signup        = true
double_confirm_changes = true
enable_confirmations = false
