<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MusiGod — Complete Checkout</title>
<style>
:root{--red:#e8262a;--bg:#0a0a0a;--surface:#151515;--text:#fff;--dim:#aaa;--border:#2a2a2a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(620px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px}
.logo{font-weight:800;font-size:22px;margin-bottom:32px}.logo span{color:var(--red)}
h1{font-size:30px;margin:0 0 12px} p{color:var(--dim);line-height:1.55}
.summary{border:1px solid var(--border);border-radius:8px;padding:16px;margin:22px 0;background:#101010}
.row{display:flex;justify-content:space-between;gap:20px;margin:8px 0}.row span:first-child{color:var(--dim)}
.btn{width:100%;border:0;border-radius:7px;background:var(--red);color:#fff;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}.note{font-size:13px;margin-top:16px}.error{color:#ff8d8d}
</style>
<script>
window.MUSIGOD_PUBLIC_CONFIG_READY = fetch('/api/public-config', {credentials:'same-origin'})
  .then(r => r.ok ? r.json() : {})
  .then(cfg => {
    window.MUSIGOD_CHECKOUT_PROVIDER = cfg.checkoutProvider || 'stripe';
    return cfg;
  })
  .catch(() => ({}));
</script>
</head>
<body>
<div class="card">
  <div class="logo">MUSI<span>GOD</span></div>
  <h1>Complete your secure checkout</h1>
  <p>Your registration has been received. <strong style="color:#fff">You have not been charged yet.</strong> Payment activates your membership and starts onboarding.</p>
  <div class="summary">
    <div class="row"><span>Plan</span><strong id="plan">—</strong></div>
    <div class="row"><span>Artist ID</span><strong id="artist">—</strong></div>
    <div class="row"><span>Status</span><strong>Payment required</strong></div>
  </div>
  <button class="btn" id="continue">Continue to Secure Checkout</button>
  <p class="note" id="status">Click the button to continue. You will be transferred to our secure payment provider.</p>
</div>
<script>
const params = new URLSearchParams(location.search);
const artistId = params.get('artist_id') || '';
const plan = (params.get('plan') || '').toLowerCase();
const labels = {starter:'Starter — $79/month',growth:'Growth — $129/month',pro:'Pro — $179/month',label:'Label — $699/month'};
document.getElementById('artist').textContent = artistId || 'Missing';
document.getElementById('plan').textContent = labels[plan] || plan || 'Missing';

async function openCheckout() {
  const btn = document.getElementById('continue');
  const status = document.getElementById('status');
  if (!artistId || !labels[plan]) {
    status.textContent = 'This checkout link is incomplete. Please return to your MusiGod registration email or contact support@musigod.com.';
    status.className = 'note error';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Opening secure checkout…';
  status.textContent = 'Preparing your secure checkout.';
  try {
    await window.MUSIGOD_PUBLIC_CONFIG_READY;
    const provider = window.MUSIGOD_CHECKOUT_PROVIDER === 'paypal' ? 'paypal' : 'stripe';
    const endpoint = provider === 'paypal' ? '/api/create-paypal-subscription' : '/api/create-checkout-session';
    const res = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({artist_id:artistId,plan})});
    const body = await res.json().catch(()=>({}));
    if (!res.ok || !body.url) throw new Error(body.error || 'Secure checkout is unavailable');
    location.href = body.url;
  } catch (err) {
    status.textContent = err.message + '. Your registration is still saved; you have not been charged.';
    status.className = 'note error';
    btn.disabled = false;
    btn.textContent = 'Retry Secure Checkout';
  }
}
document.getElementById('continue').addEventListener('click', openCheckout);
</script>
</body>
</html>
