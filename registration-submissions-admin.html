<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Submissions | MusiGod Admin</title><style>
:root{--ink:#142033;--gold:#b78417;--line:#dbe1e9;--bg:#eef1f5;--red:#99283b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}header,main{max-width:1240px;margin:auto;padding:24px}.brand{font-weight:900;letter-spacing:.12em}.brand span{color:var(--gold)}h1{font-size:34px;margin:20px 0 4px}.bar,.grid,.formgrid{display:grid;gap:12px}.bar{grid-template-columns:1fr auto}.grid{grid-template-columns:repeat(4,1fr);margin:22px 0}.formgrid{grid-template-columns:repeat(2,1fr)}.card,.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}.card b{display:block;font-size:24px}.muted{color:#657287}input,select,textarea,button{padding:11px;border:1px solid var(--line);border-radius:6px;font:inherit}textarea{min-height:150px;width:100%;margin-top:12px}button{background:var(--ink);color:white;font-weight:700;cursor:pointer}.smallbtn{padding:6px 9px;margin:2px;font-size:12px}.gold{background:var(--gold)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;text-transform:uppercase}.blocked{color:var(--red)}@media(max-width:800px){.grid,.formgrid{grid-template-columns:1fr}.bar{grid-template-columns:1fr}}</style></head><body>
<header><div class="brand">MUSI<span>GOD</span> ADMIN</div><h1>Registration Submission Engine</h1><p class="muted">Create, approve, download, deliver and reconcile controlled registration packages.</p><div class="bar"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="load">Load engine</button></div></header>
<main><div id="notice" class="panel">Enter the admin key to load submission operations.</div><section id="metrics" class="grid"></section><section class="panel"><h2>Create submission package</h2><div class="formgrid"><select id="profile"><option value="">Profile</option></select><select id="authorization"><option value="">Executed authorization</option></select><select id="destination"><option>ASCAP</option><option>BMI</option><option>MLC</option><option>SOUNDEXCHANGE</option></select><input id="catalog" placeholder="Catalog reference"><input id="publisherName" placeholder="Publisher / administrator name"><input id="publisherIpi" placeholder="Publisher IPI"></div><textarea id="tracks" placeholder='Tracks JSON array'></textarea><button id="create" class="gold">Validate and create frozen package</button></section><section class="panel"><h2>Destination capability</h2><div id="destinations"></div></section><section class="panel"><h2>Submission packages</h2><div id="packages"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;const table=(rows,cols)=>rows.length?`<table><thead><tr>${cols.map(x=>`<th>${esc(x[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(x=>`<td>${x[2]?x[1](r):esc(x[1](r))}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p class="muted">No records yet.</p>';
async function call(action,input){const r=await fetch('/api/admin/registration-submissions',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':$('key').value.trim()},body:JSON.stringify({action,input})}),d=await r.json();if(!r.ok)throw Error(d.detail||d.error);return d}function actions(p){let h=p.payload?.artifact&&['APPROVED','DISPATCHING','SUBMITTED','PARTIALLY_ACCEPTED','ACCEPTED','REJECTED_BY_DESTINATION','CLOSED'].includes(p.status)?`<button class="smallbtn" onclick="downloadArtifact('${p.id}')">Download</button>`:'';if(p.status==='READY_FOR_REVIEW')h+=`<button class="smallbtn gold" onclick="approvePackage('${p.id}')">Approve</button>`;if(['APPROVED','FAILED','PARTIALLY_ACCEPTED','REJECTED_BY_DESTINATION'].includes(p.status)&&p.channel==='PORTAL_FILE')h+=`<button class="smallbtn" onclick="beginDelivery('${p.id}')">${p.attempt_count?'Resubmit':'Begin delivery'}</button>`;if(p.status==='DISPATCHING')h+=`<button class="smallbtn" onclick="receipt('${p.id}')">Confirmation</button><button class="smallbtn" onclick="deliveryFailure('${p.id}')">Delivery failed</button>`;if(p.status==='SUBMITTED')h+=`<button class="smallbtn" onclick="outcome('${p.id}')">Outcome</button>`;return h||'—'}
async function load(){try{const r=await fetch('/api/admin/registration-submissions',{headers:{'x-admin-key':$('key').value.trim()}}),d=await r.json();if(!r.ok)throw Error(d.detail||d.error);state=d;$('notice').innerHTML=`<b>${esc(d.engine_version)}</b> · Frozen SHA-256 artifacts. SoundExchange is partner-ready, not externally enabled.`;$('metrics').innerHTML=`<div class="card"><b>${Object.keys(d.destinations).length}</b>Destinations</div><div class="card"><b>${d.packages.length}</b>Packages</div><div class="card"><b>${d.packages.filter(x=>x.status==='READY_FOR_REVIEW').length}</b>Awaiting approval</div><div class="card"><b>${d.connectors.filter(x=>x.status==='VERIFIED').length}</b>Verified connectors</div>`;$('profile').innerHTML='<option value="">Select profile</option>'+d.profiles.map(x=>`<option value="${x.id}">${esc(x.artist_name||x.legal_name)}</option>`).join('');filterAuth();$('destinations').innerHTML=table(Object.entries(d.destinations).map(([destination,x])=>({destination,...x,connector:d.connectors.find(c=>c.destination===destination)?.status||'NOT CONFIGURED'})),[['Destination',x=>x.destination],['Rights',x=>x.rights],['Channel',x=>x.channel],['Format',x=>x.format],['Connector',x=>x.connector]]);$('packages').innerHTML=table(d.packages,[['Created',x=>new Date(x.created_at).toLocaleString()],['Destination',x=>x.destination],['Status',x=>x.status],['Attempts',x=>x.attempt_count],['Confirmation',x=>x.external_reference],['Issue',x=>x.last_error_safe],['Actions',actions,true]])}catch(e){$('notice').innerHTML=`<span class="blocked">${esc(e.message)}</span>`}}function filterAuth(){const id=$('profile').value;$('authorization').innerHTML='<option value="">Select executed authorization</option>'+((state?.authorizations||[]).filter(x=>!id||x.profile_id===id).map(x=>`<option value="${x.id}">${esc(x.scope)} · ${new Date(x.executed_at).toLocaleDateString()}</option>`).join(''))}
$('profile').onchange=filterAuth;$('load').onclick=load;$('create').onclick=async()=>{try{await call('create_plan',{profile_id:$('profile').value,authorization_id:$('authorization').value,destination:$('destination').value,catalog_id:$('catalog').value,publisher:{name:$('publisherName').value,ipi:$('publisherIpi').value},tracks:JSON.parse($('tracks').value)});await load()}catch(e){alert(e.message)}};async function approvePackage(id){const reviewer_id=prompt('Approving administrator auth-user UUID:'),notes=prompt('Approval notes (minimum 12 characters):');if(reviewer_id&&notes){await call('approve',{package_id:id,reviewer_id,reviewer_role:'registration_admin',notes});await load()}}async function beginDelivery(id){const reviewer_id=prompt('Delivery operator auth-user UUID:');if(reviewer_id){await call('begin_portal_delivery',{package_id:id,reviewer_id,notes:'Approved artifact prepared for authorized portal delivery.'});await load()}}async function receipt(id){const external_reference=prompt('Portal confirmation / receipt number:');if(external_reference){await call('record_receipt',{package_id:id,external_reference,received_at:new Date().toISOString(),notes:'Portal delivery confirmation recorded.'});await load()}}async function deliveryFailure(id){const reason=prompt('Delivery failure reason:');if(reason){await call('record_delivery_failure',{package_id:id,reason});await load()}}async function outcome(id){const status=prompt('Outcome: ACCEPTED, PARTIALLY_ACCEPTED, or REJECTED_BY_DESTINATION'),reason=status==='ACCEPTED'?'':prompt('Reason / rejection details:');if(status){await call('record_outcome',{package_id:id,status:status.toUpperCase(),reason,received_at:new Date().toISOString()});await load()}}async function downloadArtifact(id){const r=await fetch(`/api/admin/registration-submissions?download=${encodeURIComponent(id)}`,{headers:{'x-admin-key':$('key').value.trim()}});if(!r.ok){const d=await r.json();throw Error(d.error)}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(r.headers.get('content-disposition')||'').match(/filename="([^"]+)/)?.[1]||'registration.csv';a.click();URL.revokeObjectURL(a.href)}Object.assign(window,{approvePackage,beginDelivery,receipt,deliveryFailure,outcome,downloadArtifact});
</script></body></html>
