<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Submissions | MusiGod Admin</title><style>
:root{--ink:#142033;--gold:#b78417;--line:#dbe1e9;--bg:#eef1f5;--red:#99283b;--green:#19724c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:24px}.brand{font-weight:900;letter-spacing:.12em}.brand span{color:var(--gold)}h1{font-size:34px;margin:20px 0 4px}.bar,.grid{display:grid;gap:12px}.bar{grid-template-columns:1fr auto}.grid{grid-template-columns:repeat(4,1fr);margin:22px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:18px}.card b{display:block;font-size:24px}.muted{color:#657287}input,button{padding:11px;border:1px solid var(--line);border-radius:6px}button{background:var(--ink);color:white;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase}.ok{color:var(--green)}.blocked{color:var(--red)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.bar{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">MUSI<span>GOD</span> ADMIN</div><h1>Registration Submission Engine</h1><p class="muted">Controlled registration packages, approvals, connector status and external receipts.</p><div class="bar"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="load">Load engine</button></div></header><main><div id="notice" class="panel">Enter the admin key to load submission operations.</div><section id="metrics" class="grid"></section><section class="panel"><h2>Destination capability</h2><div id="destinations"></div></section><section class="panel"><h2>Submission packages</h2><div id="packages"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(rows,cols)=>rows.length?`<table><thead><tr>${cols.map(x=>`<th>${esc(x[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(x=>`<td>${esc(x[1](r))}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p class="muted">No records yet.</p>';
$('load').onclick=async()=>{try{const r=await fetch('/api/admin/registration-submissions',{headers:{'x-admin-key':$('key').value.trim()}}),d=await r.json();if(!r.ok)throw Error(d.detail||d.error);const ps=d.packages||[],cs=d.connectors||[];$('notice').innerHTML=`<b>Engine ${esc(d.engine_version)}</b> · External delivery requires a verified connector and receipt.`;$('metrics').innerHTML=`<div class="card"><b>${Object.keys(d.destinations).length}</b><span>Destinations</span></div><div class="card"><b>${ps.length}</b><span>Packages</span></div><div class="card"><b>${ps.filter(x=>x.status==='READY_FOR_REVIEW').length}</b><span>Awaiting approval</span></div><div class="card"><b>${cs.filter(x=>x.status==='VERIFIED').length}</b><span>Verified connectors</span></div>`;$('destinations').innerHTML=table(Object.entries(d.destinations).map(([destination,x])=>({destination,...x,connector:cs.find(c=>c.destination===destination)?.status||'NOT CONFIGURED'})),[['Destination',x=>x.destination],['Rights',x=>x.rights],['Channel',x=>x.channel],['Format',x=>x.format],['Connector',x=>x.connector]]);$('packages').innerHTML=table(ps,[['Created',x=>new Date(x.created_at).toLocaleString()],['Destination',x=>x.destination],['Channel',x=>x.channel],['Status',x=>x.status],['Receipt',x=>x.external_reference]]);}catch(e){$('notice').innerHTML=`<span class="blocked">${esc(e.message)}</span>`}};
</script></body></html>
