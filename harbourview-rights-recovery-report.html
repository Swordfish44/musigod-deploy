<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rights Recovery Report | MusiGod Enterprise</title><style>
:root{--ink:#152033;--muted:#617087;--gold:#b78316;--line:#d9dfE8;--soft:#f4f6f9;--red:#9c2436}*{box-sizing:border-box}body{margin:0;background:#e9edf3;color:var(--ink);font:14px/1.55 Inter,system-ui,sans-serif}.auth{max-width:1160px;margin:20px auto;display:flex;gap:8px;padding:0 20px}.auth input{flex:1;padding:11px;border:1px solid var(--line);border-radius:6px}.auth button,.print{padding:11px 16px;border:0;border-radius:6px;background:var(--ink);color:white;font-weight:700;cursor:pointer}.paper{max-width:1160px;margin:0 auto 40px;background:white;padding:56px;box-shadow:0 8px 35px #24324a25}.brand{font-weight:900;letter-spacing:.13em}.brand span{color:var(--gold)}h1{font-size:42px;line-height:1.05;margin:55px 0 10px}h2{font-size:20px;margin:36px 0 12px;border-bottom:2px solid var(--ink);padding-bottom:7px}.sub,.muted{color:var(--muted)}.meta,.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.box{border:1px solid var(--line);padding:14px;border-radius:7px}.box b{display:block;font-size:23px}.box small{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted)}.warning{border-left:4px solid var(--gold);background:#fff9e9;padding:14px}.legal{border-left-color:var(--red);background:#fff2f4}ul{padding-left:20px}.empty{color:var(--muted);padding:18px 0}.status{margin-left:auto}.hide{display:none}@media(max-width:760px){.paper{padding:25px}.metrics,.meta{grid-template-columns:1fr 1fr}h1{font-size:32px}}@media print{body{background:white}.auth{display:none}.paper{box-shadow:none;margin:0;max-width:none;padding:30px}.print{display:none}}
</style></head><body><div class="auth"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="load">Generate secured report</button><button class="print" onclick="window.print()">Print / Save PDF</button></div><main class="paper"><div class="brand">MUSI<span>GOD</span> ENTERPRISE</div><h1>Rights Recovery Report</h1><p class="sub" id="subtitle">HarbourView Portfolio Rights Integrity Pilot · Load authorized workspace data to generate report.</p><div id="content"><div class="warning">This report remains empty until an authorized administrator loads the secured workspace.</div></div></main><script>
const $=id=>document.getElementById(id),safe=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(value,currency='USD')=>value==null?'Not quantified':new Intl.NumberFormat('en-US',{style:'currency',currency}).format(value);
const table=(rows,cols)=>rows.length?`<table><thead><tr>${cols.map(c=>`<th>${safe(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${safe(c[1](r))}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">None identified in the authorized data reviewed.</div>';
function render(s){const a=s.assets||[],m=s.asset_matches||[],r=s.royalty_reconciliations||[],o=s.ownership_conflicts||[],p=s.recovery_opportunities||[],f=s.findings||[],u=s.uploads||[],t=s.review_tasks||[];const open=v=>!['resolved','rejected','approved','closed','legal_reviewed'].includes(v);const verified=p.filter(x=>x.amount_basis==='verified'&&x.amount!=null),estimated=p.filter(x=>x.amount_basis==='estimate'&&x.amount!=null);const total=rows=>rows.reduce((n,x)=>n+Number(x.amount||0),0);$('subtitle').textContent=`${s.organization.name} · ${s.workspace.name||s.workspace.workspace_code} · Generated ${new Date().toLocaleString()}`;$('content').innerHTML=`<div class="meta"><div class="box"><small>Report status</small><b>Controlled analysis</b></div><div class="box"><small>Authorization</small><b>${s.gates.source_authorization_approved?'Approved':'Not approved'}</b></div><div class="box"><small>External submission</small><b>Disabled</b></div><div class="box"><small>Legal determination</small><b>Human review</b></div></div><h2>Executive summary</h2><p>MusiGod analyzed ${a.length} portfolio assets from ${u.length} authorized source file(s). The controlled workflow identified ${m.filter(x=>['exact','probable'].includes(x.classification)).length} exact or probable cross-source matches, ${r.filter(x=>x.status!=='matched').length} reconciliation exceptions, ${o.filter(x=>open(x.resolution_status)).length} unresolved ownership conflicts, and ${p.filter(x=>x.status!=='rejected').length} prioritized recovery opportunities. ${t.filter(x=>['open','in_progress','blocked'].includes(x.status)).length} review tasks remain open.</p><div class="metrics"><div class="box"><b>${a.length}</b><small>Assets reviewed</small></div><div class="box"><b>${f.filter(x=>open(x.review_status)).length}</b><small>Open data findings</small></div><div class="box"><b>${o.filter(x=>open(x.resolution_status)).length}</b><small>Ownership conflicts</small></div><div class="box"><b>${p.length}</b><small>Recovery opportunities</small></div></div><h2>Value classification</h2><div class="warning"><b>Verified payable amounts:</b> ${verified.length?money(total(verified),verified[0].currency):'None established from current evidence.'}<br><b>Potential estimates:</b> ${estimated.length?money(total(estimated),estimated[0].currency):'None quantified.'}<br><br>Estimates are potential opportunities—not amounts owed or guaranteed recoveries. Counterparty confirmation and governing source evidence are required.</div><h2>Source files analyzed</h2>${table(u,[['Source',x=>x.filename],['Rows',x=>x.row_count],['Status',x=>x.status],['Received',x=>x.uploaded_at?new Date(x.uploaded_at).toLocaleDateString():'—']])}<h2>Identifier and registration gaps</h2>${table(f,[['Finding',x=>x.finding_type],['Summary',x=>x.summary],['Review status',x=>x.review_status]])}<h2>Royalty reconciliation</h2>${table(r,[['Status',x=>x.status],['Reported',x=>money(x.reported_amount,x.currency)],['Expected',x=>money(x.expected_amount,x.currency)],['Variance',x=>money(x.variance,x.currency)],['Evidence basis',x=>x.amount_basis]])}<h2>Ownership conflicts</h2>${table(o,[['Classification',x=>x.classification],['Reasons',x=>(x.reasons||[]).join('; ')],['Status',x=>x.resolution_status],['Legal conclusion',x=>x.legal_conclusion||'Not determined — legal review required']])}<h2>Prioritized recovery opportunities</h2>${table(p,[['Reference',x=>x.opportunity_reference],['Priority',x=>`${x.priority} (${x.score})`],['Value',x=>money(x.amount,x.currency)],['Basis',x=>x.amount_basis],['Status',x=>x.status]])}<h2>Required next actions</h2><ul><li>Resolve all open identifier, reconciliation, and ownership findings with named-reviewer notes.</li><li>Confirm any estimated value against complete statements, contractual terms, and authoritative rate evidence.</li><li>Obtain written client approval before preparing or transmitting correction or recovery packages.</li><li>Route all chain-of-title questions to qualified legal review.</li></ul><h2>Limitations and assumptions</h2><div class="warning legal">Analysis is limited to customer-authorized sources in this workspace. A system finding is not a legal ownership determination. Missing data may reflect an incomplete source. No external correction, registration, claim, or payment submission is enabled by this report.</div>`}
$('load').onclick=async()=>{try{const res=await fetch('/api/enterprise/harbourview-workspace',{headers:{'x-admin-key':$('key').value.trim()}}),data=await res.json();if(!res.ok)throw Error(data.detail||data.error);render(data)}catch(e){$('content').innerHTML=`<div class="warning legal">${safe(e.message)}</div>`}};
</script></body></html>
