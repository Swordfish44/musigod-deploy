<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusiGod — Sign In</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--red:#e8262a;--line:#2b2b2b;--muted:#999}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090909;color:#fff;font-family:'DM Sans',sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(440px,100%);background:#121212;border:1px solid var(--line);border-radius:12px;padding:32px}.logo{font-size:24px;font-weight:800;margin-bottom:34px}.logo b{color:var(--red)}h1{margin:0 0 8px;font-size:30px}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:24px}label{display:block;font-size:12px;color:#bbb;margin:15px 0}input{display:block;width:100%;margin-top:7px;padding:12px;background:#090909;color:#fff;border:1px solid #3a3a3a;border-radius:6px;font:inherit}button{width:100%;border:0;border-radius:6px;background:var(--red);color:#fff;padding:12px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}.error{color:#ff7b7b;font-size:13px;min-height:20px}.legal{font-size:11px;color:#666;margin-top:22px}</style></head><body><main class="box"><div class="logo">MUSI<b>GOD</b></div><h1>Artist sign in</h1><p class="sub">Sign in to securely access your Rights Registration Center.</p><form id="form"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><p id="error" class="error"></p><button id="submit">Sign in securely</button></form><p class="legal">MusiGod will never ask for passwords to ASCAP, BMI, The MLC, SoundExchange or other rights organizations.</p></main><script>const SB='https://uykzkrnoetcldeuxzqyy.supabase.co',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5a3prcm5vZXRjbGRldXh6cXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA2MTksImV4cCI6MjA5MzEwNjYxOX0.r4Dx_Jkgje2kYNGh9PQtuyuJgBGJwVAviHM9QmAJcrs',KEY='sb-uykzkrnoetcldeuxzqyy-auth-token';form.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');b.disabled=true;b.textContent='Signing in…';err.textContent='';try{const r=await fetch(`${SB}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({email:e.target.email.value.trim(),password:e.target.password.value})}),j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Sign-in failed');localStorage.setItem(KEY,JSON.stringify(j));location.replace('/dashboard/registrations')}catch(x){err.textContent=x.message;b.disabled=false;b.textContent='Sign in securely'}};</script></body></html>
